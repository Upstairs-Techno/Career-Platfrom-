spring.application.name=upstairs-techno-backend

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/upstairs_techno}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${FRONTEND_URL:https://careers.upstairstechno.com,https://upstairstechno.com,https://*.vercel.app,http://localhost:5173}

# ---- Mail (configure in production; app must not crash without these) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:hr@upstairstechno.com}

# ---- First admin bootstrap (only used if admins table is empty) ----
app.admin.bootstrap.login-id=${ADMIN_BOOTSTRAP_LOGIN_ID:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Administrator}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@upstairstechno.com}

server.port=${SERVER_PORT:8080}
server.error.include-message=always

# ---- File Uploads ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.resume-dir=${RESUME_UPLOAD_DIR:./uploads/resumes}
